<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>味一番つばさ 経営ダッシュボード</title>
<style>
:root{--nav:#17365d;--blue:#4472c4;--bg:#f4f7fb;--text:#1f2937;--muted:#64748b;--ok:#e2f0d9;--warn:#fff2cc;--ng:#fce4d6;--line:#d9e2f3}
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--nav);color:#fff;padding:18px}header h1{margin:0;font-size:23px}header .sub{color:#dbeafe;margin-top:5px}
main{max-width:1180px;margin:auto;padding:16px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:0;border-radius:9px;padding:11px 15px;background:#dbe5f4;color:#17365d;font-weight:800}.tabs button.active{background:var(--nav);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.panel{background:#fff;border-radius:13px;padding:16px;box-shadow:0 1px 7px #ccd}.label{font-size:14px;color:var(--muted)}.big{font-size:27px;font-weight:900;color:var(--nav);margin-top:6px}.small{font-size:13px;color:var(--muted);margin-top:5px}.notice{padding:13px;border-radius:10px;margin:12px 0}.ok{background:var(--ok)}.warn{background:var(--warn)}.ng{background:var(--ng)}
.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border:1px solid var(--line);text-align:right;white-space:nowrap}th{background:var(--blue);color:#fff}th:nth-child(2),td:nth-child(2){text-align:left}.status-ok{color:#15803d;font-weight:800}.status-ng{color:#b91c1c;font-weight:800}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar input{padding:10px;border:1px solid #b8c4d6;border-radius:8px;min-width:240px}.hidden{display:none}@media(max-width:650px){main{padding:10px}.big{font-size:23px}th,td{font-size:13px;padding:7px}}
</style>
</head>
<body>
<header><h1>味一番つばさ　経営ダッシュボード</h1><div class="sub">7月は月間ジャーナル原本から再構築／6月は未監査</div></header>
<main>
<div class="tabs">
<button class="active" data-tab="summary">概要</button>
<button data-tab="products">商品別</button>
<button data-tab="abc">ABC分析</button>
<button data-tab="daily">日別</button>
<button data-tab="audit">品質監査</button>
</div>
<section id="summary"></section><section id="products" class="hidden"></section><section id="abc" class="hidden"></section><section id="daily" class="hidden"></section><section id="audit" class="hidden"></section>
</main>
<script>
const JULY={month:'2026-07',sales:4917050,customers:3525,issued:5048,settlement:-53,net:4995,days:27};
const PRODUCTS=[
['究極の味噌ラーメン',1100,1891,-20,2058100],['バターコーンラーメン味噌',1400,456,-1,637000],['チャーシュー麺味噌',1450,120,0,174000],['ネギたっぷりラーメン味噌',1300,88,0,114400],['ピリ辛ネギラーメン味噌',1300,108,0,140400],['キムチラーメン味噌',1250,17,0,21250],['ラーメン醤油',980,138,-2,133280],['バターコーンラーメン醤油',1300,23,0,29900],['チャーシュー麺醤油',1350,25,0,33750],['ネギたっぷりラーメン醤油',1180,14,0,16520],['ピリ辛ネギラーメン醤油',1180,21,-1,23600],['キムチラーメン醤油',1130,1,0,1130],['ラーメン塩',980,136,-1,132300],['バターコーンラーメン塩',1300,27,0,35100],['チャーシュー麺塩',1350,10,-1,12150],['ネギたっぷりラーメン塩',1180,24,0,28320],['ピリ辛ネギラーメン塩',1180,13,0,15340],['キムチラーメン塩',1130,2,0,2260],['味噌＋餃子セット',1450,123,0,178350],['醤油＋餃子セット',1400,10,0,14000],['塩＋餃子セット',1400,6,0,8400],['大盛り',200,120,-2,23600],['トッピングチャーシュー',450,22,0,9900],['辛みそラーメン（期間限定）',1200,54,-1,63600],['お子様ハーフ味噌',700,147,0,102900],['お子様ハーフ醤油',650,26,0,16900],['お子様ハーフ塩',650,21,0,13650],['キムチわかめたまご',150,23,0,3450],['バター・コーン',200,78,-1,15400],['ねぎ・ピリ辛ねぎ',200,33,0,6600],['ライス大',200,48,-2,9200],['ライス小',150,89,-1,13200],['チャーハン',800,135,0,108000],['餃子（1皿6個）',500,233,-17,108000],['お土産ラーメン',700,24,0,16800],['生ビール',600,291,0,174600],['瓶ビール',700,281,-3,194600],['冷酒',700,11,0,7700],['ジュース・コーラ',300,58,0,17400],['つばさラーメン',2000,101,0,202000]
].map((x,i)=>({rank:i+1,name:x[0],price:x[1],issued:x[2],settlement:x[3],net:x[2]+x[3],sales:x[4]}));
const VERIFIED_DAILY={
'2026-07-28':{sales:146640,customers:110,issued:144,settlement:-2,net:142},
'2026-07-29':{sales:167650,customers:131,issued:177,settlement:-2,net:175},
'2026-07-30':{sales:173080,customers:130,issued:188,settlement:-2,net:186},
'2026-07-31':{sales:210550,customers:140,issued:213,settlement:-3,net:210}
};
const yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');const pct=n=>(n*100).toFixed(1)+'%';
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function category(n){if(/ビール|冷酒|ジュース/.test(n))return'飲料';if(/セット/.test(n))return'セット';if(/餃子|チャーハン|ライス|大盛り|トッピング|バター|ねぎ|キムチわかめ|お土産/.test(n))return'サイド・追加';return'ラーメン'}
function renderSummary(){document.querySelector('#summary').innerHTML=`<div class="notice ok"><b>7月月間原本を唯一の基準として再構築しました。</b> 商品別の発行数・精算数・正味出数・売上は原本40品目から直接作成しています。</div><div class="cards"><div class="card"><div class="label">7月総売上</div><div class="big">${yen(JULY.sales)}</div></div><div class="card"><div class="label">入店数</div><div class="big">${JULY.customers.toLocaleString()}人</div></div><div class="card"><div class="label">客単価</div><div class="big">${yen(JULY.sales/JULY.customers)}</div></div><div class="card"><div class="label">発行数</div><div class="big">${JULY.issued.toLocaleString()}</div></div><div class="card"><div class="label">精算数</div><div class="big">${JULY.settlement}</div></div><div class="card"><div class="label">正味出数</div><div class="big">${JULY.net.toLocaleString()}</div></div><div class="card"><div class="label">平均日商</div><div class="big">${yen(JULY.sales/JULY.days)}</div></div></div><div class="panel" style="margin-top:12px"><h3>管理状態</h3>${table(['対象','状態','扱い'],[['7月月間総額','確定','月間ジャーナル原本'],['7月商品別','確定','40品目・原本転記'],['7月日別','再監査中','原本確認済み4日だけ表示'],['6月','未監査','月間集計票なし・比較に使用しない'],['経営利益','未確定','7月給与・社会保険・仕入等が未反映']])}</div>`}
function productRows(list){return list.map((p,i)=>[i+1,p.name,category(p.name),yen(p.price),p.issued,p.settlement,p.net,yen(p.sales),pct(p.sales/JULY.sales)])}
function renderProducts(){document.querySelector('#products').innerHTML=`<div class="panel"><div class="toolbar"><input id="search" placeholder="商品名を検索"><b>全40品目</b></div><div id="productTable"></div></div>`;const draw=()=>{const q=(document.querySelector('#search').value||'').trim();document.querySelector('#productTable').innerHTML=table(['順位','商品','分類','単価','発行','精算','正味出数','売上','構成比'],productRows(PRODUCTS.filter(p=>p.name.includes(q))))};document.querySelector('#search').addEventListener('input',draw);draw()}
function renderABC(){let cum=0;const sorted=[...PRODUCTS].sort((a,b)=>b.sales-a.sales);const rows=sorted.map((p,i)=>{cum+=p.sales/JULY.sales;const cls=cum<=.7?'A':cum<=.9?'B':'C';return[i+1,cls,p.name,p.net,yen(p.sales),pct(p.sales/JULY.sales),pct(cum)]});document.querySelector('#abc').innerHTML=`<div class="notice warn">ABC分析は7月月間原本の商品売上だけから計算しています。</div><div class="panel">${table(['順位','ABC','商品','正味出数','売上','構成比','累積'],rows)}</div>`}
function renderDaily(){const rows=[];for(let d=1;d<=31;d++){const ds='2026-07-'+String(d).padStart(2,'0');const wd=new Date(ds+'T00:00:00').getDay();if(wd===1){rows.push([ds,'月','定休日','—','—','—','—','—']);continue}const r=VERIFIED_DAILY[ds];if(r)rows.push([ds,['日','月','火','水','木','金','土'][wd],'原本確認済',yen(r.sales),r.customers,r.issued,r.settlement,r.net]);else rows.push([ds,['日','月','火','水','木','金','土'][wd],'再監査中','—','—','—','—','—'])}document.querySelector('#daily').innerHTML=`<div class="notice warn"><b>日別は作り直し中です。</b> 数字を推測せず、原本確認済みの7月28日〜31日だけ確定表示しています。</div><div class="panel">${table(['日付','曜','状態','売上','入店数','発行','精算','正味'],rows)}</div>`}
function audit(){const names=PRODUCTS.map(p=>p.name);const duplicate=[...new Set(names.filter((n,i)=>names.indexOf(n)!==i))];const checks=[['商品数',PRODUCTS.length,40,PRODUCTS.length===40],['商品名重複',duplicate.length,0,duplicate.length===0],['発行数合計',PRODUCTS.reduce((s,p)=>s+p.issued,0),JULY.issued,PRODUCTS.reduce((s,p)=>s+p.issued,0)===JULY.issued],['精算数合計',PRODUCTS.reduce((s,p)=>s+p.settlement,0),JULY.settlement,PRODUCTS.reduce((s,p)=>s+p.settlement,0)===JULY.settlement],['正味出数合計',PRODUCTS.reduce((s,p)=>s+p.net,0),JULY.net,PRODUCTS.reduce((s,p)=>s+p.net,0)===JULY.net],['売上合計',PRODUCTS.reduce((s,p)=>s+p.sales,0),JULY.sales,PRODUCTS.reduce((s,p)=>s+p.sales,0)===JULY.sales],['チャーハン件数',PRODUCTS.filter(p=>p.name==='チャーハン').length,1,PRODUCTS.filter(p=>p.name==='チャーハン').length===1],['チャーハン正味出数',PRODUCTS.find(p=>p.name==='チャーハン')?.net,135,PRODUCTS.find(p=>p.name==='チャーハン')?.net===135],['チャーハン売上',PRODUCTS.find(p=>p.name==='チャーハン')?.sales,108000,PRODUCTS.find(p=>p.name==='チャーハン')?.sales===108000]];document.querySelector('#audit').innerHTML=`<div class="panel"><h3>自動監査</h3>${table(['検査','実績','原本','判定'],checks.map(x=>[x[0],typeof x[1]==='number'?x[1].toLocaleString():x[1],typeof x[2]==='number'?x[2].toLocaleString():x[2],x[3]?'<span class="status-ok">合格</span>':'<span class="status-ng">不合格</span>']))}</div><div class="notice ${checks.every(x=>x[3])?'ok':'ng'}"><b>${checks.every(x=>x[3])?'月間商品データは全検査合格':'不合格項目あり・公開禁止'}</b></div>`}
renderSummary();renderProducts();renderABC();renderDaily();audit();
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.querySelector('#'+b.dataset.tab).classList.remove('hidden')});
</script>
</body></html>
