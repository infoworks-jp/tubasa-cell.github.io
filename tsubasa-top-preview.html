ck;color:#b92920;font-weight:400}.next{min-height:100svh;background:#050404;position:relative;overflow:hidden;padding:14vh 8vw;display:grid;place-items:center}.next:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(128,16,10,.16),transparent 32%),linear-gradient(180deg,#040303,#090505)}.next-inner{position:relative;z-index:2;width:min(1080px,100%);display:grid;grid-template-columns:.72fr 1fr;gap:10vw;align-items:end}.next small{font:10px/1.5 sans-serif;letter-spacing:.35em;color:#9d8980}.next h2{font-size:clamp(40px,5.4vw,78px);font-weight:400;line-height:1.22;letter-spacing:.1em;margin:.4em 0}.next p{max-width:600px;color:#c8bdb5;line-height:2.25;letter-spacing:.08em;margin:0}.rule{width:1px;height:160px;background:linear-gradient(#a9120b,transparent);margin-top:34px}@keyframes photoIn{from{opacity:0;transform:scale(1.13)}to{opacity:1;transform:scale(1.045)}}@keyframes titleUp{from{transform:translateY(110%);opacity:.2}to{transform:translateY(0);opacity:1}}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes line{0%,100%{opacity:.3;transform:scaleY(.45);transform-origin:top}50%{opacity:1;transform:scaleY(1)}}@media(max-width:800px){.hero{min-height:730px}.photo{inset:0;background-size:auto 100%;background-position:62% center;transform:none;animation:fade 1.4s both;filter:saturate(.98) contrast(1.03) brightness(.83)}.grade{background:linear-gradient(180deg,rgba(0,0,0,.28) 0,rgba(0,0,0,.04) 35%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.72) 100%),linear-gradient(90deg,rgba(0,0,0,.32),transparent 55%)}.vignette{box-shadow:inset 0 0 90px 15px rgba(0,0,0,.28)}.topbar{left:5vw;right:5vw;top:3.5vh}.logo{font-size:23px}.spec{left:auto;right:6vw;top:17vh;text-align:right;font-size:8px}.ink-note{display:none}.copy{left:7vw;bottom:7.2vh;max-width:86vw}.copy h1{font-size:clamp(44px,12vw,64px);letter-spacing:.07em;margin-bottom:13px}.copy p{font-size:11px;letter-spacing:.16em}.kicker{font-size:8px;margin-bottom:14px}.seal{left:5.5vw;bottom:4.4vh}.drag{display:none}.next{padding:12vh 8vw}.next-inner{grid-template-columns:1fr;gap:3vh}.rule{height:80px}}@media(max-width:480px){.photo{background-size:auto 100%;background-position:64% center}.spec{top:14vh}.copy{bottom:6.5vh}.copy h1{font-size:clamp(41px,11.8vw,58px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}</style></head><body><main class="hero" id="hero"><div class="photo"></div><div class="grade"></div><canvas id="fluid"></canvas><div class="grain"></div><div class="vignette"></div><div class="topbar"><div class="logo">つばさ<em>味一番</em></div><div class="menu" aria-label="menu"><i></i><i></i><i></i></div></div><div class="spec">SAPPORO · SUSUKINO<br>STEAM / INK STUDY<br><b>№ 01 — MISO</b></div><div class="ink-note">DRAG TO FLOW<br>TAP TO BURST<b>SCROLL TO DESCEND</b></div><div class="copy"><div class="kicker">SIGNATURE 01</div><h1><span>究極の味噌</span></h1><p>すすきので四半世紀。 一杯に、熱を。</p></div><div class="seal">翼</div><div class="drag">DRAG THE STEAM</div></main><section class="next"><div class="next-inner"><div><small>AJIICHIBAN TSUBASA · SUSUKINO</small><div class="rule"></div></div><div><h2>湯気の向こうに、<br>札幌がある。</h2><p>味一番つばさ。札幌・すすきの、新ラーメン横丁。熱い一杯を、今日も。</p></div></div></section><script>(()=>{const c=document.getElementById('fluid'),ctx=c.getContext('2d',{alpha:true});let W=0,H=0,D=Math.min(devicePixelRatio||1,2),drops=[],last={x:0,y:0};function rs(){const h=document.getElementById('hero');W=h.clientWidth;H=h.clientHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}function spawn(x,y,n=10,power=1,red=false){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(.08+Math.random()*.55)*power;drops.push({x:x+(Math.random()-.5)*24,y:y+(Math.random()-.5)*18,vx:Math.cos(a)*s,vy:-.22-Math.random()*.52-Math.abs(Math.sin(a))*s*.25,r:18+Math.random()*58,stretch:1.2+Math.random()*1.4,alpha:.018+Math.random()*.06,life:0,max:180+Math.random()*280,red:red||Math.random()<.06,phase:Math.random()*6.28})}}function pointer(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}addEventListener('resize',rs,{passive:true});c.addEventListener('pointerdown',e=>{const p=pointer(e);last=p;spawn(p.x,p.y,32,2.4,true)});c.addEventListener('pointermove',e=>{const p=pointer(e);const dx=p.x-last.x,dy=p.y-last.y;last=p;if(e.buttons||e.pointerType==='touch'){spawn(p.x,p.y,7,1.4,false);for(let i=drops.length-1;i>=0&&i>drops.length-45;i--){drops[i].vx+=dx*.006;drops[i].vy+=dy*.003}}});addEventListener('scroll',()=>spawn(W*.62,H*.48,5,.8,true),{passive:true});function draw(){ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='screen';for(let i=drops.length-1;i>=0;i--){const p=drops[i];p.life++;const age=p.life/p.max;p.x+=p.vx+Math.sin(p.life*.022+p.phase)*.15;p.y+=p.vy;p.vx*=.993;p.vy*=.998;p.r+=.05;const k=Math.max(0,Math.sin(Math.min(1,age)*Math.PI));if(age>=1||p.y<-140){drops.splice(i,1);continue}const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);if(p.red){g.addColorStop(0,`rgba(160,24,15,${p.alpha*k*1.35})`);g.addColorStop(.3,`rgba(92,8,4,${p.alpha*k})`);g.addColorStop(1,'rgba(0,0,0,0)')}else{g.addColorStop(0,`rgba(250,244,238,${p.alpha*k})`);g.addColorStop(.28,`rgba(190,178,168,${p.alpha*k*.5})`);g.addColorStop(1,'rgba(0,0,0,0)')}ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*.52,p.r*p.stretch,Math.sin(p.life*.01+p.phase)*.36,0,Math.PI*2);ctx.fill()}const mobile=W<800;const sx=W*(mobile?.64:.65),sy=H*(mobile?.42:.44);if(drops.length<150&&Math.random()<.82)spawn(sx+(Math.random()-.5)*30,sy+(Math.random()-.5)*12,1,.35,false);requestAnimationFrame(draw)}rs();for(let i=0;i<95;i++)spawn(W*.65,H*(.40+Math.random()*.17),1,.25,false);draw();})();</script></body></html>
