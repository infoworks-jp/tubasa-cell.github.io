D,0,0)}function add(px,py,n=8,push=0){for(let i=0;i<n;i++)p.push({x:px+(Math.random()-.5)*35,y:py+(Math.random()-.5)*20,vx:(Math.random()-.5)*(.35+push),vy:-.25-Math.random()*.5,r:20+Math.random()*65,a:.035+Math.random()*.09,t:0,m:180+Math.random()*260,red:Math.random()<.045})}function pos(e){let r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}addEventListener('resize',rs);addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){let q=pos(e);add(q[0],q[1],7,1.8)}});addEventListener('pointerdown',e=>{let q=pos(e);add(q[0],q[1],28,3)});addEventListener('scroll',()=>add(W*.62,H*.54,4,.4),{passive:true});function frame(){x.clearRect(0,0,W,H);x.globalCompositeOperation='screen';for(let i=p.length-1;i>=0;i--){let a=p[i];a.t++;a.x+=a.vx+Math.sin((a.t+a.y)*.017)*.16;a.y+=a.vy;a.vx*=.992;a.r+=.06;let k=1-a.t/a.m;if(k<=0||a.y<-120){p.splice(i,1);continue}let g=x.createRadialGradient(a.x,a.y,0,a.x,a.y,a.r);if(a.red){g.addColorStop(0,`rgba(150,24,13,${a.a*k})`);g.addColorStop(1,'rgba(80,0,0,0)')}else{g.addColorStop(0,`rgba(245,235,225,${a.a*k})`);g.addColorStop(.3,`rgba(190,180,170,${a.a*k*.5})`);g.addColorStop(1,'rgba(0,0,0,0)')}x.fillStyle=g;x.beginPath();x.ellipse(a.x,a.y,a.r*.65,a.r*1.6,Math.sin(a.t*.008)*.3,0,Math.PI*2);x.fill()}if(p.length<150&&Math.random()<.9)add(W*(innerWidth<800?.56:.67),H*(innerWidth<800?.52:.58),1,.15);requestAnimationFrame(frame)}rs();for(let i=0;i<100;i++)add(W*.65,H*(.5+Math.random()*.2),1,.1);frame()})()</script></body></html>
