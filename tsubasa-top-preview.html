<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>味一番つばさ｜トップページ試作</title>
<style>
:root{--ink:#050505;--verm:#9d0a0a;--paper:#ece7de;--gold:#a78345}
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}body{overflow-x:hidden}
.hero{position:relative;min-height:100svh;isolation:isolate;background:#050505;overflow:hidden}
#ink{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.9;mix-blend-mode:screen;pointer-events:none}
.bg{position:absolute;inset:0;z-index:-2;background:
radial-gradient(circle at 73% 55%,rgba(120,15,8,.42),transparent 36%),
radial-gradient(circle at 10% 90%,rgba(115,0,0,.34),transparent 34%),
linear-gradient(180deg,#050505 0%,#080706 45%,#170605 100%)}
.bg:after{content:"";position:absolute;inset:0;background-image:repeating-radial-gradient(circle at 20% 30%,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);opacity:.35;mix-blend-mode:soft-light}
.ramen{position:absolute;z-index:1;left:50%;bottom:-1.5vmin;width:min(72vw,1120px);transform:translateX(-50%);filter:drop-shadow(0 24px 28px rgba(0,0,0,.65));}
.ramen img{display:block;width:100%;height:auto;object-fit:contain;object-position:center bottom;mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 96%);}
.smoke-veil{position:absolute;z-index:2;inset:0;background:radial-gradient(ellipse at 50% 34%,rgba(255,255,255,.055),transparent 28%);pointer-events:none;mix-blend-mode:screen}
.brand{position:absolute;z-index:4;left:4.5vw;top:4.2vh;writing-mode:vertical-rl;font-family:"Yu Mincho",serif;font-weight:700;letter-spacing:.15em;font-size:clamp(22px,2vw,34px);text-shadow:0 1px 20px #000}
.brand small{font-size:10px;color:#a40000;margin-top:8px}
.copy{position:absolute;z-index:4;left:5vw;bottom:8vh;max-width:520px;text-shadow:0 2px 22px #000}
.copy .eyebrow{font:500 12px/1.2 ui-serif,Georgia,serif;letter-spacing:.28em;color:#d9c9b7;margin-bottom:14px}.copy h1{margin:0;font-size:clamp(38px,5.4vw,82px);font-weight:500;letter-spacing:.12em;line-height:1.15}.copy p{margin:18px 0 0;font-size:clamp(13px,1.15vw,17px);letter-spacing:.16em;color:#e9e3dc}
.menu{position:absolute;z-index:5;right:4.5vw;top:4vh;width:34px;height:24px;display:grid;align-content:space-between}.menu span{height:1px;background:#eee;display:block}
.scroll{position:absolute;z-index:5;right:4.6vw;bottom:5vh;writing-mode:vertical-rl;font:10px/1 ui-sans-serif,sans-serif;letter-spacing:.24em;color:#bbb}.scroll:after{content:"";display:block;width:1px;height:52px;background:#bbb;margin:12px auto 0;animation:drop 1.8s ease-in-out infinite}@keyframes drop{0%,100%{opacity:.25;transform:scaleY(.35);transform-origin:top}50%{opacity:1;transform:scaleY(1)}}
.panel{min-height:90vh;background:#080808;display:grid;place-items:center;padding:12vh 7vw;border-top:1px solid rgba(255,255,255,.06)}.panel-inner{max-width:1100px;width:100%;display:grid;grid-template-columns:1fr 1.15fr;gap:8vw;align-items:center}.panel h2{font-size:clamp(30px,4vw,60px);font-weight:500;letter-spacing:.13em;margin:0}.panel p{color:#cfc9c2;line-height:2.2;letter-spacing:.08em}.rule{width:64px;height:1px;background:#8f1111;margin:24px 0}
@media(max-width:800px){.hero{min-height:100svh}.ramen{width:128vw;left:56%;bottom:3vh}.copy{left:7vw;bottom:7vh;max-width:82vw}.copy .eyebrow{font-size:10px}.copy h1{font-size:clamp(32px,11vw,56px);line-height:1.18}.brand{left:5vw;top:3.5vh;font-size:24px}.menu{right:5vw}.scroll{display:none}.panel-inner{grid-template-columns:1fr}.panel{padding:10vh 8vw}}
@media(max-aspect-ratio:3/4){.ramen{width:145vw;left:58%;bottom:9vh}.copy{bottom:4vh}.hero:after{content:"";position:absolute;z-index:3;left:0;right:0;bottom:0;height:35vh;background:linear-gradient(transparent,rgba(0,0,0,.58))}}
</style>
</head>
<body>
<section class="hero" id="hero">
<div class="bg"></div>
<canvas id="ink"></canvas>
<div class="smoke-veil"></div>
<div class="brand">つばさ<small>味一番</small></div>
<div class="menu" aria-label="menu"><span></span><span></span><span></span></div>
<div class="ramen"><img alt="究極の味噌ラーメン" src="https://static.wixstatic.com/media/4d13fe_696168f8e6394f7595a9168e02a58cb4~mv2.png/v1/fill/w_1400,h_1100,al_c,q_95,enc_auto/4d13fe_696168f8e6394f7595a9168e02a58cb4~mv2.png"></div>
<div class="copy"><div class="eyebrow">SIGNATURE 01 — MISO</div><h1>究極の味噌</h1><p>すすきので四半世紀。湯気まで、旨い。</p></div>
<div class="scroll">SCROLL</div>
</section>
<section class="panel"><div class="panel-inner"><div><div style="font-size:12px;letter-spacing:.28em;color:#a9875a">SAPPORO · SUSUKINO</div><h2>一杯に、<br>熱を残す。</h2><div class="rule"></div></div><p>現行サイトの「究極のラーメンを皆様へ」「すすきので四半世紀。」という核は残し、見せ方だけを刷新。黒、朱、湯気、墨の流れを軸に、スマートフォンでは縦、PCでは横へ自然にトリミングされるトップページです。</p></div></section>
<script>
(()=>{
const c=document.getElementById('ink'),ctx=c.getContext('2d',{alpha:true});let dpr=Math.min(devicePixelRatio||1,2),W=0,H=0,pts=[],pointer={x:.5,y:.45,active:false};
function resize(){W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function seed(x=.5,y=.52,n=7,burst=false){for(let i=0;i<n;i++){pts.push({x:x*W+(Math.random()-.5)*26,y:y*H+(Math.random()-.5)*18,vx:(Math.random()-.5)*(burst?1.9:.45),vy:-(.18+Math.random()*.5),r:22+Math.random()*56,a:.05+Math.random()*.12,life:0,max:180+Math.random()*260,red:Math.random()<.08})}}
function move(e){let r=c.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width;pointer.y=(e.clientY-r.top)/r.height;if(e.buttons||e.pointerType==='touch')seed(pointer.x,pointer.y,5,false)}
addEventListener('resize',resize,{passive:true});addEventListener('pointermove',move,{passive:true});addEventListener('pointerdown',e=>{move(e);seed(pointer.x,pointer.y,22,true)},{passive:true});addEventListener('scroll',()=>seed(.5,.38,4,false),{passive:true});
function draw(){ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='screen';for(let i=pts.length-1;i>=0;i--){let p=pts[i];p.life++;p.x+=p.vx+Math.sin((p.life+p.y)*.018)*.13;p.y+=p.vy;p.vx*=.994;p.r+=.05;let k=1-p.life/p.max;if(k<=0||p.y<-100){pts.splice(i,1);continue}let g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);if(p.red){g.addColorStop(0,`rgba(125,15,10,${p.a*k})`);g.addColorStop(1,'rgba(70,0,0,0)')}else{g.addColorStop(0,`rgba(235,225,215,${p.a*k})`);g.addColorStop(.35,`rgba(160,150,145,${p.a*k*.45})`);g.addColorStop(1,'rgba(0,0,0,0)')}ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*.72,p.r*1.45,Math.sin(p.life*.01)*.22,0,Math.PI*2);ctx.fill()}
if(pts.length<110&&Math.random()<.8)seed(.50+Math.sin(performance.now()*.00023)*.035,.58,1,false);requestAnimationFrame(draw)}
resize();for(let i=0;i<80;i++)seed(.5,.6,1,false);draw();
})();
</script>
</body></html>
