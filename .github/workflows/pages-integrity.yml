name: Pages integrity check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required public files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manual/index.html
          test -s manual.html
          test -s tsubasa-top-preview.html
          test -f .nojekyll
          grep -q '原本主義・推測禁止・公開確認必須' manual/index.html
          grep -q 'つばさ1' manual/index.html
          grep -q 'すすきので、' tsubasa-top-preview.html
          grep -q '味噌バターコーン' tsubasa-top-preview.html
          grep -q 'つばさラーメン' tsubasa-top-preview.html
          grep -q '月曜日' tsubasa-top-preview.html

      - name: Validate internal manual link
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'url=./manual/' manual.html

      - name: Install Chromium
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Start local preview
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tsubasa-http.log 2>&1 &
          echo $! > /tmp/tsubasa-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/tsubasa-top-preview.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tsubasa-http.log
          exit 1

      - name: Capture desktop and mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v chromium-browser || command -v chromium)
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=1440,1000 --screenshot=tsubasa-desktop.png http://127.0.0.1:4173/tsubasa-top-preview.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=390,844 --screenshot=tsubasa-mobile.png http://127.0.0.1:4173/tsubasa-top-preview.html
          test -s tsubasa-desktop.png
          test -s tsubasa-mobile.png

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tsubasa-visual-qa
          path: |
            tsubasa-desktop.png
            tsubasa-mobile.png
          retention-days: 14

      - name: Publish verification summary
        shell: bash
        run: |
          {
            echo '## GitHub Pages integrity'
            echo '- index.html: OK'
            echo '- manual/index.html: OK'
            echo '- manual.html fallback: OK'
            echo '- tsubasa-top-preview.html: OK'
            echo '- desktop screenshot: captured'
            echo '- mobile screenshot: captured'
            echo '- .nojekyll: OK'
          } >> "$GITHUB_STEP_SUMMARY"
