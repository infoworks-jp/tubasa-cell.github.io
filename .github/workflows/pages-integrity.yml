name: Pages integrity check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify preview source
        shell: bash
        run: |
          set -euo pipefail
          test -s tsubasa-top-preview.html
          grep -q 'すすきので、' tsubasa-top-preview.html
          grep -q '味噌バターコーン' tsubasa-top-preview.html
          grep -q 'つばさラーメン' tsubasa-top-preview.html
          grep -q '月曜日' tsubasa-top-preview.html

      - name: Install Chromium and Puppeteer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null

      - name: Start local preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tsubasa-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/tsubasa-top-preview.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tsubasa-http.log
          exit 1

      - name: Capture full-page desktop and mobile screenshots
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          CHROME=$(command -v chromium-browser || command -v chromium)
          export CHROME
          cat > capture.cjs <<'EOF'
          const puppeteer = require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            async function shot(name,width,height,mobile){
              const page=await browser.newPage();
              await page.setViewport({width,height,deviceScaleFactor:1,isMobile:mobile,hasTouch:mobile});
              await page.goto('http://127.0.0.1:4173/tsubasa-top-preview.html',{waitUntil:'networkidle2',timeout:45000});
              const result=await page.evaluate(async()=>{
                const sleep=ms=>new Promise(r=>setTimeout(r,ms));
                document.documentElement.style.scrollBehavior='auto';
                const step=Math.max(220,Math.floor(innerHeight*.35));
                const max=document.documentElement.scrollHeight-innerHeight;
                for(let y=0;y<=max;y+=step){
                  window.scrollTo(0,y);
                  await sleep(220);
                }
                window.scrollTo(0,max);
                await sleep(500);
                const hidden=[...document.querySelectorAll('.reveal:not(.on)')].map((el,i)=>({i,cls:el.className,text:(el.textContent||'').trim().slice(0,60)}));
                window.scrollTo(0,0);
                await sleep(2200);
                return {hidden,total:document.querySelectorAll('.reveal').length,height:document.documentElement.scrollHeight};
              });
              console.log(name,JSON.stringify(result));
              if(result.hidden.length){throw new Error(`${name}: ${result.hidden.length}/${result.total} reveal elements never became visible: ${JSON.stringify(result.hidden)}`)}
              await page.screenshot({path:name,fullPage:true});
              await page.close();
            }
            await shot('tsubasa-desktop.png',1440,1000,false);
            await shot('tsubasa-mobile.png',390,844,true);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node capture.cjs
          test -s tsubasa-desktop.png
          test -s tsubasa-mobile.png

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tsubasa-visual-qa
          path: |
            tsubasa-desktop.png
            tsubasa-mobile.png
          retention-days: 14

      - name: Publish verification summary
        shell: bash
        run: |
          echo '## Visual QA' >> "$GITHUB_STEP_SUMMARY"
          echo '- desktop full-page screenshot: captured after complete reveal validation' >> "$GITHUB_STEP_SUMMARY"
          echo '- mobile full-page screenshot: captured after complete reveal validation' >> "$GITHUB_STEP_SUMMARY"
