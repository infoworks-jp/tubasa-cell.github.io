name: Pages integrity check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required public files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manual/index.html
          test -s manual.html
          test -s tsubasa-top-preview.html
          test -f .nojekyll
          grep -q '原本主義・推測禁止・公開確認必須' manual/index.html
          grep -q 'つばさ1' manual/index.html
          grep -q 'すすきので、' tsubasa-top-preview.html
          grep -q '味噌バターコーン' tsubasa-top-preview.html
          grep -q 'つばさラーメン' tsubasa-top-preview.html
          grep -q '月曜日' tsubasa-top-preview.html

      - name: Validate internal manual link
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'url=./manual/' manual.html

      - name: Install Chromium and Puppeteer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null

      - name: Start local preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tsubasa-http.log 2>&1 &
          echo $! > /tmp/tsubasa-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/tsubasa-top-preview.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tsubasa-http.log
          exit 1

      - name: Capture full-page desktop and mobile screenshots
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          CHROME=$(command -v chromium-browser || command -v chromium)
          export CHROME
          cat > /tmp/capture.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox','--disable-dev-shm-usage']});
          async function shot(name,width,height,mobile=false){
            const page=await browser.newPage();
            await page.setViewport({width,height,deviceScaleFactor:1,isMobile:mobile,hasTouch:mobile});
            await page.goto('http://127.0.0.1:4173/tsubasa-top-preview.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(async()=>{
              const sleep=ms=>new Promise(r=>setTimeout(r,ms));
              for(let y=0;y<document.body.scrollHeight;y+=Math.max(400,innerHeight*.7)){scrollTo(0,y);await sleep(120)}
              scrollTo(0,0); await sleep(800);
            });
            await page.screenshot({path:name,fullPage:true,captureBeyondViewport:true});
            await page.close();
          }
          await shot('tsubasa-desktop.png',1440,1000,false);
          await shot('tsubasa-mobile.png',390,844,true);
          await browser.close();
          EOF
          node /tmp/capture.mjs
          test -s tsubasa-desktop.png
          test -s tsubasa-mobile.png

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tsubasa-visual-qa
          path: |
            tsubasa-desktop.png
            tsubasa-mobile.png
          retention-days: 14

      - name: Publish verification summary
        shell: bash
        run: |
          {
            echo '## GitHub Pages integrity'
            echo '- tsubasa-top-preview.html: OK'
            echo '- desktop full-page screenshot: captured'
            echo '- mobile full-page screenshot: captured'
            echo '- visual QA artifact: uploaded'
          } >> "$GITHUB_STEP_SUMMARY"
