name: Apply corrected July 22 daily data
on:
  push:
    paths:
      - '.github/workflows/apply-july22-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct July 22 daily row and recalculate totals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          token = 'const EMBEDDED_DATA='
          start = text.find(token)
          if start < 0:
              raise RuntimeError('EMBEDDED_DATA start not found')
          js = start + len(token)
          ends = [text.find(x, js) for x in (';\nfunction embeddedKey',';\r\nfunction embeddedKey',';\n\nfunction embeddedKey')]
          ends = [x for x in ends if x >= 0]
          if not ends:
              raise RuntimeError('EMBEDDED_DATA end not found')
          end = min(ends)
          data = json.loads(text[js:end])

          corrected = {
              'business_date':'2026-07-22',
              'total_sales':196500,
              'customers':162,
              'avg_spend':1213,
              'issued_count':None,
              'settlement_count':None,
              'settlement_amount':None,
              'net_count':None,
              'lunch_sales':None,
              'evening_sales':None,
              'late_sales':None,
              'notes':'7/22券売機原本の読み取り記録に基づき日別売上・客数・客単価を修正。未確認の内訳は推測入力しない。'
          }

          for key in ('daily_2026-07','daily_all'):
              rows = data.get(key)
              if isinstance(rows, list):
                  rows[:] = [r for r in rows if r.get('business_date') != '2026-07-22']
                  rows.append(dict(corrected))
                  rows.sort(key=lambda r: r.get('business_date',''))

          def stats(rows):
              active = [r for r in rows if int(r.get('total_sales') or 0) > 0]
              sales = sum(int(r.get('total_sales') or 0) for r in active)
              customers = sum(int(r.get('customers') or 0) for r in active)
              days = len(active)
              return sales, customers, days, sales/days if days else 0, sales/customers if customers else 0

          july = data.get('daily_2026-07', [])
          allrows = data.get('daily_all') or data.get('daily_2026-06', []) + july
          jsales, jcust, jdays, javg, jspend = stats(july)
          tsales, tcust, tdays, tavg, tspend = stats(allrows)

          for row in data.get('monthly', []):
              if row.get('month') == '2026-07':
                  row.update({'sales':jsales,'customers':jcust,'days':jdays,'avg_daily':javg,'avg_spend':jspend})

          overview = data.get('overview_2026-07')
          if isinstance(overview, dict):
              overview.update({'month':'2026-07','total_sales':tsales,'total_customers':tcust,'total_days':tdays,'month_sales':jsales,'month_customers':jcust,'month_days':jdays,'avg_daily':javg,'avg_spend':jspend,'projection':javg*27})

          boot = data.get('bootstrap', {}).get('overview')
          if isinstance(boot, dict):
              boot.update({'month':'2026-07','total_sales':tsales,'total_customers':tcust,'total_days':tdays,'month_sales':jsales,'month_customers':jcust,'month_days':jdays,'avg_daily':javg,'avg_spend':jspend,'projection':javg*27})

          new = json.dumps(data, ensure_ascii=False, separators=(',',':'))
          text = text[:js] + new + text[end:]
          text = text.replace('売上は7月22日分まで','売上は7月23日分まで')
          path.write_text(text, encoding='utf-8')
          print({'july_sales':jsales,'july_customers':jcust,'july_days':jdays})
          PY
      - name: Commit result
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '7月22日の日別売上を196,500円へ修正'
          git push
