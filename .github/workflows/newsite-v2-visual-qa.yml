name: Newsite V2 Visual QA

on:
  push:
    branches: [main]
    paths:
      - 'newsite/v2/**'
      - '.github/workflows/newsite-v2-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Wait for deployed v2
        shell: bash
        run: |
          set -euo pipefail
          URL='https://infoworks-jp.github.io/tubasa-cell.github.io/newsite/v2/'
          for i in {1..30}; do
            code=$(curl -L -s -o /tmp/page.html -w '%{http_code}' "$URL" || true)
            if [ "$code" = '200' ] && grep -q 'NEW SITE V2' /tmp/page.html; then exit 0; fi
            echo "attempt $i HTTP $code"; sleep 5
          done
          exit 1
      - name: Capture PC and mobile
        shell: bash
        run: |
          set -euo pipefail
          BROWSER=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          URL='https://infoworks-jp.github.io/tubasa-cell.github.io/newsite/v2/'
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=tsubasa-v2-pc.png "$URL"
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=3500 --window-size=390,844 --screenshot=tsubasa-v2-mobile.png "$URL"
          test -s tsubasa-v2-pc.png
          test -s tsubasa-v2-mobile.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tsubasa-newsite-v2-visual-qa
          path: |
            tsubasa-v2-pc.png
            tsubasa-v2-mobile.png
          if-no-files-found: error
