name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'manual/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.svg' -o -name '*.ico' \) -exec cp {} _site/ \;
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d manual ]; then cp -R manual _site/manual; fi
          if [ -d docs ]; then cp -R docs _site/docs; fi
          python - <<'PY'
          from pathlib import Path

          p = Path('_site/index.html')
          text = p.read_text(encoding='utf-8')
          old = '<button id="t_expenses" onclick="showTab(\'expenses\')">仕入・外注・経費</button>'
          new = '<button id="t_expenses" onclick="location.href=\'./expenses.html\'">仕入・外注・経費 ↗</button>'
          if old in text:
              text = text.replace(old, new, 1)

          scripts = [
              '<script src="./assets/labor-cost-patch.js"></script>',
              '<script src="./assets/consulting-july-fix.js"></script>',
              '<script src="./assets/validation-fix.js"></script>',
              '<script src="./assets/daily-display-fix.js"></script>',
          ]
          for script in scripts:
              if script not in text:
                  text = text.replace('</body>', script + '</body>', 1)

          replacements = {
              'ゼイリシクミアイ': '岡税理士事務所',
              'カ）イマイ': '株式会社イマイ',
              'カ)イマイ': '株式会社イマイ',
              'オオクマショウテン': '大熊商店',
              'オオワクショウテン': '大熊商店',
              'ノウユウ': '農友（豚肉・その他食材）',
              'NSSシャロウシ': 'MAST社会保険労務士法人',
              'NSS.シャロウシ': 'MAST社会保険労務士法人',
              'イモンホームズ': 'イモンホームズ（駐車場賃貸）',
              'ケイヒ': '現金経費',
          }
          for src, dst in replacements.items():
              text = text.replace(src, dst)
          p.write_text(text, encoding='utf-8')

          ep = Path('_site/expenses.html')
          if ep.exists():
              e = ep.read_text(encoding='utf-8')
              for src, dst in replacements.items():
                  e = e.replace(src, dst)
              ep.write_text(e, encoding='utf-8')
          PY
          touch _site/.nojekyll
      - name: Verify required files and constants
        run: |
          test -f _site/index.html || (echo "ERROR: index missing" && exit 1)
          test -f _site/manual/index.html || (echo "ERROR: manual missing" && exit 1)
          test -f _site/assets/labor-cost-patch.js || (echo "ERROR: labor patch missing" && exit 1)
          test -f _site/assets/consulting-july-fix.js || (echo "ERROR: consulting patch missing" && exit 1)
          test -f _site/assets/validation-fix.js || (echo "ERROR: validation patch missing" && exit 1)
          test -f _site/assets/daily-display-fix.js || (echo "ERROR: daily display patch missing" && exit 1)
          grep -q './assets/validation-fix.js' _site/index.html || (echo "ERROR: validation patch not linked" && exit 1)
          grep -q './assets/daily-display-fix.js' _site/index.html || (echo "ERROR: daily display patch not linked" && exit 1)
          grep -q '4917050' _site/assets/validation-fix.js || (echo "ERROR: July confirmed sales missing" && exit 1)
          grep -q '4995250' _site/assets/validation-fix.js || (echo "ERROR: June confirmed sales missing" && exit 1)
          grep -q '2026-07-31' _site/assets/daily-display-fix.js || (echo "ERROR: July 31 row missing" && exit 1)
          echo "OK: validation and full July daily display are deployed"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4