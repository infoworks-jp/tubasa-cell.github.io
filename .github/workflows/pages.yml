name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'manual/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare clean static site
        run: |
          rm -rf _site
          mkdir _site
          cp index-rebuilt.html _site/index.html
          cp index-rebuilt.html _site/index-rebuilt.html
          if [ -f monthly-check.html ]; then cp monthly-check.html _site/monthly-check.html; fi
          if [ -f admin-audit.html ]; then cp admin-audit.html _site/admin-audit.html; fi
          if [ -d manual ]; then cp -R manual _site/manual; fi
          if [ -d docs ]; then cp -R docs _site/docs; fi
          touch _site/.nojekyll
      - name: Verify rebuilt dashboard
        run: |
          test -f _site/index.html || (echo "ERROR: rebuilt index missing" && exit 1)
          grep -q "const JULY={month:'2026-07',sales:4917050,customers:3525,issued:5048,settlement:-53,net:4995,days:27}" _site/index.html || (echo "ERROR: July monthly constants incorrect" && exit 1)
          grep -q "\['チャーハン',800,135,0,108000\]" _site/index.html || (echo "ERROR: fried rice source row incorrect" && exit 1)
          grep -q "全40品目" _site/index.html || (echo "ERROR: product count label missing" && exit 1)
          grep -q "商品名重複" _site/index.html || (echo "ERROR: duplicate QA missing" && exit 1)
          grep -q "2026-07-31" _site/index.html || (echo "ERROR: verified July 31 data missing" && exit 1)
          if grep -q "labor-cost-patch.js\|consulting-july-fix.js\|validation-fix.js\|daily-display-fix.js\|product-july-fix.js\|admin-stabilization.js" _site/index.html; then
            echo "ERROR: old patch scripts must not be loaded" && exit 1
          fi
          echo "OK: rebuilt July source passes deployment checks"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4