name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'manual/**'
      - 'docs/**'
      - 'preview/**'
      - 'newsite/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.svg' -o -name '*.ico' \) -exec cp {} _site/ \;
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d manual ]; then cp -R manual _site/manual; fi
          if [ -d docs ]; then cp -R docs _site/docs; fi
          if [ -d preview ]; then cp -R preview _site/preview; fi
          if [ -d newsite ]; then cp -R newsite _site/newsite; fi
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          text=p.read_text(encoding='utf-8')
          scripts=[
            '<script src="./assets/labor-cost-patch.js"></script>',
            '<script src="./assets/consulting-july-fix.js"></script>',
            '<script src="./assets/validation-fix.js"></script>',
            '<script src="./assets/daily-display-fix.js"></script>',
            '<script src="./assets/product-july-fix.js"></script>',
            '<script src="./assets/monthly-cutoff-fix.js"></script>',
            '<script src="./assets/admin-stabilization.js"></script>',
            '<script src="./assets/july-source-of-truth.js"></script>',
          ]
          for script in scripts:
            if script not in text:
              text=text.replace('</body>',script+'</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          touch _site/.nojekyll
      - name: Verify source of truth
        run: |
          test -f _site/index.html
          test -f _site/preview/index.html
          test -f _site/newsite/index.html
          test -f _site/newsite/assets/tsubasa-sprite.webp
          test -f _site/assets/july-source-of-truth.js
          grep -q 'data-lang="en"' _site/newsite/index.html
          grep -q 'data-lang="ko"' _site/newsite/index.html
          grep -q 'data-lang="zh"' _site/newsite/index.html
          grep -q './assets/july-source-of-truth.js' _site/index.html
          grep -q "sales:4917050" _site/assets/july-source-of-truth.js
          grep -q "issued:5048" _site/assets/july-source-of-truth.js
          grep -q "settlement:-53" _site/assets/july-source-of-truth.js
          grep -q "net:4995" _site/assets/july-source-of-truth.js
          grep -q "\['チャーハン',800,135,0,108000\]" _site/assets/july-source-of-truth.js
          python - <<'PY'
          import re
          s=open('_site/assets/july-source-of-truth.js',encoding='utf-8').read()
          rows=re.findall(r"\['([^']+)',(\d+),(\d+),(-?\d+),(\d+)\]",s)
          assert len(rows)==40, len(rows)
          names=[r[0] for r in rows]
          assert len(set(names))==40
          issued=sum(int(r[2]) for r in rows)
          settlement=sum(int(r[3]) for r in rows)
          sales=sum(int(r[4]) for r in rows)
          assert issued==5048, issued
          assert settlement==-53, settlement
          assert issued+settlement==4995
          assert sales==4917050, sales
          print('OK: 40 products, no duplicates, all totals match July journal')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
