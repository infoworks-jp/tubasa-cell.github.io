name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'manual/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.svg' -o -name '*.ico' \) -exec cp {} _site/ \;
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d manual ]; then cp -R manual _site/manual; fi
          if [ -d docs ]; then cp -R docs _site/docs; fi
          touch _site/.nojekyll
      - name: Verify required files
        run: |
          test -f _site/index.html || (echo "ERROR: _site/index.html missing" && exit 1)
          test -f _site/expenses.html || (echo "ERROR: _site/expenses.html missing" && exit 1)
          test -f _site/assets/labor-cost-patch.js || (echo "ERROR: labor patch missing" && exit 1)
          test -f _site/assets/tubasa1-fixes.js || (echo "ERROR: Tsubasa 1 fixes missing" && exit 1)
          test -f _site/manual/index.html || (echo "ERROR: _site/manual/index.html missing" && exit 1)
          grep -q './assets/labor-cost-patch.js' _site/index.html || (echo "ERROR: source patch is not linked" && exit 1)
          grep -q './assets/tubasa1-fixes.js' _site/index.html || (echo "ERROR: source fixes are not linked" && exit 1)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
