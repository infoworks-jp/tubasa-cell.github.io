name: Tsubasa visual QA
on:
  push:
    branches: [main]
    paths:
      - 'tsubasa-top-preview.html'
      - '.github/workflows/tsubasa-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium tooling
        run: |
          npm init -y
          npm install puppeteer@24
      - name: Capture PC/mobile interactive QA
        env:
          TARGET: https://infoworks-jp.github.io/tubasa-cell.github.io/tsubasa-top-preview.html?v=${{ github.sha }}
        run: |
          mkdir -p qa
          cat > qa.mjs <<'EOF'
          import puppeteer from 'puppeteer'; import fs from 'node:fs';
          const browser=await puppeteer.launch({headless:true,args:['--no-sandbox']});
          const failures=[];
          for(const [name,width,height] of [['pc',1440,1000],['mobile',390,844]]){
            const p=await browser.newPage(); await p.setViewport({width,height,deviceScaleFactor:1});
            try{
              await p.goto(process.env.TARGET,{waitUntil:'networkidle2',timeout:90000});
              await p.screenshot({path:`qa/${name}-full.png`,fullPage:true});
              const sections=await p.$$('main.scene, section');
              for(let i=0;i<sections.length;i++){await sections[i].evaluate(el=>el.scrollIntoView({block:'center'}));await new Promise(r=>setTimeout(r,900));await p.screenshot({path:`qa/${name}-${i}.png`});}
              const d=await p.evaluate(()=>{
                const food=[...document.querySelectorAll('.food')];
                const bg=food.map(s=>{const el=s.querySelector('.photo,.bg');return el?getComputedStyle(el).backgroundImage:''});
                const store=document.querySelector('.store .photo,.store-bg');
                return {scrollWidth:document.documentElement.scrollWidth,innerWidth,
                  titles:food.map(s=>{const c=s.querySelector('.copy');return {text:s.querySelector('h2')?.textContent.trim()||'',opacity:c?getComputedStyle(c).opacity:'0'}}),
                  images:[...bg,store?getComputedStyle(store).backgroundImage:''],
                  links:[...document.querySelectorAll('a')].map(a=>a.href),canvases:document.querySelectorAll('canvas.flow').length};
              });
              fs.writeFileSync(`qa/${name}.json`,JSON.stringify(d,null,2));
              if(d.scrollWidth>d.innerWidth+2) failures.push(`${name}: horizontal overflow`);
              if(d.titles.length!==4) failures.push(`${name}: expected 4 product titles, got ${d.titles.length}`);
              if(d.titles.some(x=>+x.opacity<.9)) failures.push(`${name}: reveal inactive`);
              if(d.images.filter(Boolean).length<5) failures.push(`${name}: product/store background missing`);
              if(d.canvases<5) failures.push(`${name}: flow canvas missing`);
              if(!d.links.some(x=>x.includes('google.com/maps'))) failures.push(`${name}: MAP missing`);
              if(!d.links.some(x=>x.startsWith('tel:'))) failures.push(`${name}: tel missing`);
              if(name==='pc'){await p.mouse.move(150,300);await p.mouse.move(800,500,{steps:15});await p.mouse.click(800,500);}
              else await p.touchscreen.tap(195,400);
              await new Promise(r=>setTimeout(r,600)); await p.screenshot({path:`qa/${name}-interaction.png`});
            }catch(e){failures.push(`${name}: ${e.message}`);fs.writeFileSync(`qa/${name}-error.txt`,e.stack||String(e));}
            await p.close();
          }
          await browser.close(); fs.writeFileSync('qa/result.txt',failures.length?'FAIL\n'+failures.join('\n'):'PASS\n');
          if(failures.length) process.exitCode=1;
          EOF
          node qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsubasa-visual-qa-${{ github.sha }}
          path: qa
          if-no-files-found: error
          retention-days: 14
